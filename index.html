        <h1>DECADENCE — CCRU Pandemonium Matrix Card Game & Oracle</h1>
        <p>Play the CCRU's Atlantean time-sorcery card game online. The most comprehensive digital implementation of the Cybernetic Culture Research Unit's Pandemonium system.</p>

        <h2>What is Decadence?</h2>
        <p>Decadence is a gambling game and divination system associated with the Western tradition of Pandemonium practice, supposedly originating in Atlantis (10,000 BC). Truncate a standard pack, removing royals, tens, and jokers — thirty-six cards remain. Five dealt face-up on the Atlantean Cross (Set-1), five face-down (Set-2). Pairs sum to ten. Negative scores call demons from the Pandemonium Matrix.</p>

        <h2>The Pandemonium Matrix — 45 Demons</h2>
        <p>Lurgo, Duoddod, Doogu, Ixix, Ixigool, Ixidod, Krako, Sukugool, Skoodu, Skarkix, Tokhatto, Tukkamu, Kuttadid, Tikkitix, Katak, Tchu, Djungo, Djuddha, Djynxx, Tchakki, Tchattuk, Puppo, Bubbamu, Oddubb, Pabbakis, Ababbatok, Papatakoo, Bobobja, Minommo, Murrumur, Nammamad, Mummumix, Numko, Muntuk, Mommoljo, Mommbo, Uttunul, Tutagool, Unnunddo, Ununuttix, Ununak, Tukutu, Unnutchi, Nuttubab, Ummnu.</p>

        <h2>Five Syzygetic Demons</h2>
        <p>Katak (5::4, Null pitch, Time-Circuit), Djynxx (6::3, Null pitch, Warp), Oddubb (7::2, Null pitch, Time-Circuit), Murrumur (8::1, Null pitch, Time-Circuit), Uttunul (9::0, Null pitch, Plex). These carry the fundamental currents of the Numogram.</p>

        <h2>The Numogram — 10 Zones</h2>
        <p>Zone-0 (Sol, Plex), Zone-1 (Mercury, Time-Circuit), Zone-2 (Venus, Time-Circuit), Zone-3 (Earth, Warp), Zone-4 (Mars, Time-Circuit), Zone-5 (Jupiter, Time-Circuit), Zone-6 (Saturn, Warp), Zone-7 (Uranus, Time-Circuit), Zone-8 (Neptune, Time-Circuit), Zone-9 (Pluto, Plex/Cthelll). Five syzygies: 9::0, 8::1, 7::2, 6::3, 5::4.</p>

        <h2>Book of Paths — 84 Oracular Readings</h2>
        <p>Mapped to demon rites by Vysparov's Pandemonium Concordance. Translated from the Tibetan by Chaim Horowitz, c. 1949. Includes Original Subtraction, Extreme Regression, Abysmal Comprehension, Primordial Breath, Slipping Backwards, Attaining Balance, Progressive Levitation, Eternal Digression, Sudden Flight, and 75 more.</p>

        <h2>Subdecadence</h2>
        <p>The ultimate blasphemy. Add four Queens (valued 0) for the four Chaotic Xenodemons: Ixix, Tchu, Ununuttix, Unnutchi. Pairs add to nine — Numogram syzygies. Negative results call lemurs from the Pandemonium Matrix.</p>

        <h2>Decadology</h2>
        <p>Nine cluster types (C/tp-#0 through C/tp-#9) mapping Amphidemons and Cyclic Chronodemons to playing cards. The Atlantean Cross spread: Far Future (top), Destructive Influences (left), Creative Influences (center), Memories and Dreams (right), Deep Past (bottom).</p>
